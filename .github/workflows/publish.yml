name: Publish

# Trusted publishing, so PyPI trusts this workflow over OIDC and no API token is stored
# here. Configure it once at pypi.org/manage/project/statsbadge-railclock/settings/publishing/
# with this repository, this filename and the `pypi` environment. The build is
# statsbadge's; the publish has to stay here, since PyPI trusts a file by name.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: pimoroni/statsbadge/.github/workflows/extension-build.yml@main

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # PyPA's action and not `uv publish`: under trusted publishing it signs each file
      # and uploads a PEP 740 attestation beside it, which PyPI shows on the file's page
      # and the project's Security tab. uv uploads attestations but makes none.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
